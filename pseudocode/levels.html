<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choose Difficulty</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Poppins", sans-serif;
        background: #f4f4f4;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .container {
        text-align: center;
        background: white;
        padding: 60px;
        border-radius: 20px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1);
      }
      h1 {
        font-size: 3rem;
        margin-bottom: 40px;
        color: #222;
      }
      .btn {
        display: inline-block;
        margin: 20px;
        padding: 25px 50px;
        font-size: 1.8rem;
        font-weight: 700;
        color: white;
        border-radius: 15px;
        text-decoration: none;
        width: 300px;
        transition: 0.3s;
      }
      .easy {
        background: #28a745;
      }
      .medium {
        background: #ffc107;
        color: #333;
      }
      .hard {
        background: #dc3545;
      }
      .btn:hover {
        transform: scale(1.05);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Choose Your Level</h1>
      <a href="practise.html?level=easy" class="btn easy">Easy</a><br />
      <a href="practise.html?level=medium" class="btn medium">Medium</a><br />
      <a href="practise.html?level=advanced" class="btn hard">Advanced</a>
    </div>
  </body>
</html>
